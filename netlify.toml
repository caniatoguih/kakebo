# Kakebo — Deploy monorepo no Netlify (frontend + API serverless)
# Site: frontend estático em frontend/dist
# API: Express via Netlify Function em /.netlify/functions/api

[build]
  command = "npm run netlify-build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Prisma precisa do client gerado antes do bundle das functions
  NPM_FLAGS = "--include=dev"

[functions]
  node_bundler = "esbuild"
  # Prisma usa binários nativos — não embutir no bundle
  external_node_modules = ["@prisma/client", ".prisma", "pino-pretty"]
  included_files = [
    "node_modules/.prisma/client/**",
    "node_modules/@prisma/client/**",
    "prisma/**"
  ]

# Proxy da API Express (rewrite, mantém o path /api/*)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# SPA fallback (React Router) — depois das rotas de API
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de segurança básicos
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
