services:
  db:
    image: postgres:15-alpine
    container_name: kakebo_db
    environment:
      POSTGRES_USER: gcaniato
      POSTGRES_PASSWORD: "9519Gc!#"
      POSTGRES_DB: kakebo
    ports:
      - "5432:5432"
    volumes:
      - kakebo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gcaniato -d kakebo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    container_name: kakebo_app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Override the DATABASE_URL to point to the 'db' container instead of 'localhost'
      - DATABASE_URL=postgresql://gcaniato:9519Gc!%23@db:5432/kakebo?schema=public
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    # Keep local development schema synchronized on startup.
    command: sh -c "npx prisma db push && npm run dev"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kakebo_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kakebo_pgdata:
