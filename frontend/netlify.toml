# Config legada do frontend isolado.
# O deploy monorepo (frontend + API) usa o netlify.toml na raiz do repositório.
# Se publicar só o frontend, configure VITE_API_URL apontando para a API.

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
